    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    #29344d 0%,
                    #111522 32%,
                    #080a10 68%,
                    #050609 100%
                );

            overflow-x: hidden;
        }

        .container {
            width: 92%;
            max-width: 440px;
            text-align: center;
            padding: 35px 20px;
        }

        /* APP ICON */
        .icon-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .app-icon {
            width: 145px;
            height: 145px;

            display: block;

            object-fit: cover;

            border-radius: 32px;

            border: 1px solid rgba(255,255,255,.14);

            box-shadow:
                0 0 0 1px rgba(255,255,255,.04),
                0 20px 55px rgba(0,0,0,.60);

            background: #11141d;
        }

        /* TITLE */
        h1 {
            font-size: 30px;
            line-height: 1.2;

            font-weight: 800;

            letter-spacing: 2px;

            margin-bottom: 12px;

            text-shadow:
                0 4px 20px rgba(0,0,0,.45);
        }

        /* DESCRIPTION */
        .subtitle {
            max-width: 390px;
            margin: 0 auto 30px;

            color: #aeb7ca;

            font-size: 14px;
            line-height: 1.65;
        }

        /* OPEN APP BUTTON */
        .open-btn {
            width: 100%;
            min-height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 12px;

            color: #080a10;

            background:
                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #e9efff 100%
                );

            text-decoration: none;

            border-radius: 17px;

            font-size: 17px;
            font-weight: 800;

            letter-spacing: .5px;

            box-shadow:
                0 14px 35px rgba(0,0,0,.40);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .open-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 18px 42px rgba(0,0,0,.50);
        }

        .open-btn:active {
            transform: scale(.97);
        }

        .arrow {
            font-size: 23px;
            line-height: 1;
        }

        /* ACTUAL APP URL */
        .url {
            margin-top: 15px;

            color: #687287;

            font-size: 12px;

            word-break: break-all;
        }

        /* FOOTER */
        .footer {
            margin-top: 48px;

            color: #60697b;

            font-size: 12px;

            line-height: 1.7;
        }

        .footer strong {
            color: #929bad;
        }

        /* MOBILE */
        @media (max-width: 400px) {

            .container {
                padding:
                    28px 16px;
            }

            .app-icon {
                width: 125px;
                height: 125px;

                border-radius: 28px;
            }

            h1 {
                font-size: 26px;
                letter-spacing: 1.5px;
            }

            .subtitle {
                font-size: 13px;
            }

            .open-btn {
                min-height: 55px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- HR STUDIO LOGO -->
        <div class="icon-wrapper">
            <img
                src="icon.png"
                alt="HR STUDIO APP Logo"
                class="app-icon"
                width="145"
                height="145"
            >
        </div>

        <!-- MAIN HEADING -->
        <h1>HR STUDIO APP</h1>

        <!-- DESCRIPTION -->
        <p class="subtitle">
            Watch what you love, discover new releases
            and explore trending shows.
        </p>

        <!-- OPEN ACTUAL APP -->
        <a
            href="https://hr-studio.pages.dev/"
            class="open-btn"
            aria-label="Open HR STUDIO App"
        >
            OPEN APP
            <span class="arrow">→</span>
        </a>

        <!-- ACTUAL APP ADDRESS -->
        <div class="url">
            https://hr-studio.pages.dev
        </div>

        <!-- FOOTER -->
        <footer class="footer">
            © 2026 <strong>HR STUDIO</strong><br>
            Made for your entertainment
        </footer>

    </main>

</body>
